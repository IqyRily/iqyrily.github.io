<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Iqy Rily — Stay bright, stay safe, and be yourself! ✨</title>
    <meta
      name="description"
      content="Stay bright, stay safe, and be yourself—wherever you go! ✨ Official persona page of Iqy Rily (IqyRily)."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://iqyrily.github.io/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Iqy Rily" />
    <meta
      property="og:description"
      content="Stay bright, stay safe, and be yourself—wherever you go!"
    />
    <meta property="og:url" content="https://iqyrily.github.io/" />
    <meta property="og:image" content="https://iqyrily.github.io/assets/thumbnail.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Iqy Rily" />
    <meta
      name="twitter:description"
      content="Stay bright, stay safe, and be yourself—wherever you go!"
    />
    <meta name="twitter:image" content="https://iqyrily.github.io/assets/thumbnail.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Inline SVG Symbols Library (Stars, Sparkles, Diamonds & Crown — no ribbon lines) -->
    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="playGoldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
          <stop offset="0%" stop-color="#FFE87A" />
          <stop offset="55%" stop-color="#FAC62D" />
          <stop offset="100%" stop-color="#F5A623" />
        </linearGradient>

        <!-- Tilted diamond confetti -->
        <symbol id="diamond-confetti" viewBox="0 0 24 24">
          <path d="M13.2 2.2 L20.8 11.4 L10.8 21.8 L3.2 12.6 Z" fill="currentColor" />
        </symbol>

        <!-- Rounded golden play triangle from the logo -->
        <symbol id="play-icon" viewBox="0 0 40 40">
          <path
            d="M 10 9 C 10 4, 14 2, 18.5 5 L 31.5 13.5 C 36 16.5, 36 20.5, 31.5 23.5 L 18.5 32 C 14 35, 10 33, 10 28 Z"
            fill="url(#playGoldGrad)"
          />
        </symbol>
      </defs>
    </svg>

    <main class="viewport-stage">
      <!-- Pure Black Backdrop + Subtle Radial Ambient Glows -->
      <div class="cosmos-bg" aria-hidden="true">
        <div class="aura aura-pink"></div>
        <div class="aura aura-lavender"></div>
        <div class="aura aura-gold"></div>
      </div>

      <!-- Subtle Outer Galaxy Dust (Diamonds only, matching logo palette) -->
      <svg
        class="cosmos-dust"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid slice"
        fill="none"
        aria-hidden="true"
      >
        <g opacity="0.56">
          <use href="#diamond-confetti" x="78" y="88" width="16" height="16" color="#7AD4FF" class="twinkle-a" />
          <use href="#diamond-confetti" x="1325" y="96" width="18" height="18" color="#FF7816" class="twinkle-b" />
          <use href="#diamond-confetti" x="92" y="768" width="16" height="16" color="#FAC62D" class="twinkle-c" />
          <use href="#diamond-confetti" x="1315" y="772" width="18" height="18" color="#C97BFF" class="twinkle-a" />
          <use href="#diamond-confetti" x="185" y="135" width="12" height="12" color="#00A8FF" />
          <use href="#diamond-confetti" x="1245" y="145" width="12" height="12" color="#FF7816" />
          <use href="#diamond-confetti" x="165" y="715" width="12" height="12" color="#FAC62D" />
          <use href="#diamond-confetti" x="1255" y="720" width="12" height="12" color="#9E1EF0" />
        </g>
        <g opacity="0.28">
          <use href="#diamond-confetti" x="-140" y="210" width="12" height="12" color="#00A8FF" />
          <use href="#diamond-confetti" x="-120" y="650" width="12" height="12" color="#FAC62D" />
          <use href="#diamond-confetti" x="480" y="-110" width="12" height="12" color="#9E1EF0" />
          <use href="#diamond-confetti" x="1040" y="-95" width="12" height="12" color="#FF7816" />
          <use href="#diamond-confetti" x="1560" y="230" width="12" height="12" color="#FAC62D" />
          <use href="#diamond-confetti" x="1550" y="670" width="12" height="12" color="#00A8FF" />
          <use href="#diamond-confetti" x="420" y="990" width="12" height="12" color="#FF7816" />
          <use href="#diamond-confetti" x="1060" y="985" width="12" height="12" color="#9E1EF0" />
        </g>
      </svg>

      <!-- Emblem Frame: Diamond Confetti & Dots (No Plus Stars, No Ribbon Lines) -->
      <div class="hero-frame">
        <svg
          class="emblem-decor"
          viewBox="0 0 1220 700"
          fill="none"
          aria-hidden="true"
        >
          <!-- Top-Left Diamonds & Dots -->
          <g class="cluster-tl">
            <use href="#diamond-confetti" x="242" y="22" width="18" height="18" color="#FAC62D" class="twinkle-a" />
            <use href="#diamond-confetti" x="315" y="42" width="20" height="20" color="#00A8FF" class="twinkle-b" />
            <use href="#diamond-confetti" x="72" y="418" width="18" height="18" color="#FAC62D" class="twinkle-c" />
            <use href="#diamond-confetti" x="128" y="335" width="14" height="14" color="#FF7816" class="twinkle-a" />
            <use href="#diamond-confetti" x="282" y="72" width="15" height="15" color="#00A8FF" />
            <use href="#diamond-confetti" x="148" y="328" width="14" height="14" color="#9E1EF0" />
            <circle cx="195" cy="48" r="2.6" fill="#FAC62D" opacity="0.85" />
            <circle cx="352" cy="56" r="2.4" fill="#7AD4FF" opacity="0.85" />
            <circle cx="52" cy="242" r="2.5" fill="#00A8FF" opacity="0.75" />
            <circle cx="115" cy="442" r="2.5" fill="#FAC62D" opacity="0.85" />
          </g>

          <!-- Bottom-Left Dot -->
          <g class="cluster-bl">
            <circle cx="122" cy="596" r="3.4" fill="#FF7816" opacity="0.85" />
          </g>

          <!-- Top-Right Dots -->
          <g class="cluster-tr">
            <circle cx="1028" cy="176" r="2.6" fill="#FF7816" opacity="0.85" />
            <circle cx="1056" cy="184" r="2" fill="#FAC62D" opacity="0.75" />
          </g>

          <!-- Bottom-Right Diamonds & Dots -->
          <g class="cluster-br">
            <use href="#diamond-confetti" x="1126" y="274" width="14" height="14" color="#FAC62D" class="twinkle-b" />
            <use href="#diamond-confetti" x="1032" y="492" width="18" height="18" color="#9E1EF0" class="twinkle-a" />
            <use href="#diamond-confetti" x="954" y="574" width="15" height="15" color="#FF7816" class="twinkle-c" />
            <use href="#diamond-confetti" x="726" y="596" width="15" height="15" color="#00A8FF" class="twinkle-b" />
            <use href="#diamond-confetti" x="768" y="638" width="14" height="14" color="#9E1EF0" />
            <circle cx="776" cy="586" r="2.8" fill="#FAC62D" opacity="0.85" />
            <circle cx="1116" cy="582" r="2.5" fill="#C97BFF" opacity="0.8" />
          </g>
        </svg>

        <!-- Centered Handle, Name, Crown & Catch Phrase -->
        <section class="center-hero" aria-label="Iqy Rily">
          <p class="persona-handle">@iqyrily</p>

          <h1 class="persona-name">
            <svg class="name-crown" aria-hidden="true">
              <use href="#play-icon" />
            </svg>
            <span class="name-main">Iqy</span> <span class="name-accent">Rily</span>
          </h1>

          <p class="catch-phrase">
            Stay bright, stay safe, and be yourself—wherever you go!
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
